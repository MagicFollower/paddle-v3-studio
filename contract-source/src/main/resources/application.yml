server:
  port: 8081
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:file:./data/contractdb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: GMT+8

logging:
  level:
    root: info